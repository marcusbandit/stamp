[versions]
agp = "9.1.1"
kotlin = "2.3.21"
coreKtx = "1.17.0"
activityCompose = "1.11.0"
composeBom = "2025.12.01"
junit = "4.13.2"
orgjson = "20250517"
maplibre = "13.7.1"
exifinterface = "1.4.2"
lifecycle = "2.10.0"
window = "1.5.0"
# Material 3 Expressive (FloatingActionButtonMenu) is newer than the Compose BOM's material3.
material3 = "1.5.0-beta02"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
orgjson = { group = "org.json", name = "json", version.ref = "orgjson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
